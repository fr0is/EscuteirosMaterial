name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 0,12 * * *"

  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: 🔔 Ping Supabase via Vercel
        run: |
          echo "A chamar o endpoint /api/ping..."

          STATUS_CODE=$(curl -s -o response.txt -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.PING_TOKEN }}" \
            "${{ secrets.PING_URL }}")

          echo "HTTP Status: $STATUS_CODE"
          cat response.txt

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo ""
            echo "✅ Supabase keep-alive executado com sucesso!"
          else
            echo ""
            echo "❌ Erro no keep-alive."
            exit 1
          fi